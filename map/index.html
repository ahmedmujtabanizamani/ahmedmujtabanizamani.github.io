<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>Leaflet Multi-Layer & Symbol Viewer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }
    .emoji-marker {
      background: none;
      border: none;
    }
    .emoji-marker-inner {
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
      transition: transform 0.15s ease;
    }
    .emoji-marker-inner:hover {
      transform: scale(1.25);
    }
    /* Custom Scrollbar for Layer List */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #c7d2fe;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

  <div class="relative w-full h-full flex flex-col md:flex-row overflow-hidden">

    <!-- Floating Mobile Top Action Bar -->
    <div class="md:hidden absolute top-3 left-3 right-3 z-[1000] flex items-center justify-between gap-2 pointer-events-none">
      <button id="openMobileMenuBtn" class="pointer-events-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-lg flex items-center gap-2 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
        </svg>
        <span>Layers & Controls</span>
      </button>

      <button id="quickLocateBtn" class="pointer-events-auto bg-white text-indigo-600 hover:bg-gray-50 font-medium px-3 py-2 rounded-xl shadow-lg flex items-center gap-1.5 text-sm transition border border-gray-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>My Location</span>
      </button>
    </div>

    <!-- Mobile Backdrop Overlay -->
    <div id="backdrop" class="fixed inset-0 bg-black/50 z-[1001] hidden md:hidden transition-opacity"></div>

    <!-- Sidebar / Mobile Drawer Panel -->
    <aside id="sidebar" class="fixed md:relative inset-x-0 bottom-0 md:inset-auto md:top-0 md:left-0 transform translate-y-full md:translate-y-0 transition-transform duration-300 ease-in-out w-full md:w-88 max-h-[85vh] md:max-h-full bg-white shadow-2xl md:shadow-xl z-[1002] flex flex-col rounded-t-2xl md:rounded-none border-t md:border-t-0 md:border-r border-gray-200 shrink-0">
      
      <!-- Mobile Drawer Handle -->
      <div class="md:hidden w-full flex justify-center pt-2.5 pb-1">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
      </div>

      <!-- Header -->
      <div class="px-4 py-3 bg-indigo-600 text-white flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <h1 class="text-base font-bold">GeoJSON Manager</h1>
        </div>
        <button id="closeSidebarBtn" class="p-1 rounded-md hover:bg-indigo-700 text-white focus:outline-none">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Scrollable Panel Body -->
      <div class="p-4 space-y-5 flex-1 overflow-y-auto custom-scroll">
        
        <!-- Location Button -->
        <div>
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Geolocation</h2>
          <button id="locateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Find My Location
          </button>
        </div>

        <hr class="border-gray-200" />

        <!-- Add Layer Form -->
        <div class="space-y-3.5">
          <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Add New Layer</h2>

          <!-- Layer Name & Symbol Customization -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">Layer Name</label>
              <input type="text" id="layerNameInput" placeholder="Layer title..." class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">Point Emoji/Symbol</label>
              <input type="text" id="pointSymbolInput" value="📍" placeholder="📍 🏢 🚗 🌲" class="w-full border border-gray-300 rounded-lg p-2 text-xs text-center focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
          </div>

          <!-- Quick Emoji Selectors -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
            <span class="text-[10px] text-gray-400 font-semibold uppercase shrink-0">Presets:</span>
            <button type="button" onclick="setEmoji('📍')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">📍</button>
            <button type="button" onclick="setEmoji('🏢')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">🏢</button>
            <button type="button" onclick="setEmoji('🚗')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">🚗</button>
            <button type="button" onclick="setEmoji('🌲')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">🌲</button>
            <button type="button" onclick="setEmoji('⚠️')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">⚠️</button>
            <button type="button" onclick="setEmoji('🚩')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">🚩</button>
            <button type="button" onclick="setEmoji('🛒')" class="px-1.5 py-0.5 bg-gray-100 hover:bg-indigo-100 rounded text-xs">🛒</button>
          </div>

          <!-- Color Customization -->
          <div class="flex items-center justify-between gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200">
            <label class="text-xs font-medium text-gray-700">Line & Polygon Color</label>
            <input type="color" id="layerColorInput" value="#3B82F6" class="w-8 h-8 rounded border border-gray-300 cursor-pointer bg-transparent">
          </div>

          <!-- Source Tabs -->
          <div class="space-y-2">
            <!-- 1. File Upload -->
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">From File (.json / .geojson)</label>
              <input type="file" id="geojsonFileInput" accept=".json,.geojson" class="hidden" />
              <label for="geojsonFileInput" class="w-full bg-gray-50 hover:bg-gray-100 text-gray-700 border-2 border-dashed border-gray-300 hover:border-indigo-500 rounded-xl p-2.5 text-center cursor-pointer block transition">
                <span class="text-xs font-medium text-gray-600">Click or drag file here</span>
              </label>
            </div>

            <!-- 2. Remote URL Loader -->
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">From URL Link</label>
              <div class="flex gap-1.5">
                <input type="url" id="geojsonUrlInput" placeholder="https://example.com/data.geojson" class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-indigo-500 focus:border-indigo-500" />
                <button id="loadUrlBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-2 rounded-lg text-xs transition shrink-0">
                  Fetch
                </button>
              </div>
            </div>

            <!-- 3. Raw Textarea Paste -->
            <div>
              <label class="text-xs font-semibold text-gray-600 mb-1 block">Paste GeoJSON Code</label>
              <textarea id="geojsonTextInput" rows="2.5" class="w-full border border-gray-300 rounded-lg p-2 text-xs font-mono focus:ring-indigo-500 focus:border-indigo-500" placeholder='{"type": "FeatureCollection", ...}'></textarea>
              <button id="loadTextBtn" class="mt-1 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 px-3 rounded-lg text-xs transition">
                Add GeoJSON Layer
              </button>
            </div>
          </div>
        </div>

        <hr class="border-gray-200" />

        <!-- Active Layers List Panel -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Active Layers (<span id="layerCount">0</span>)</h2>
            <button id="clearAllLayersBtn" class="text-xs text-red-600 hover:text-red-800 underline font-medium">
              Remove All
            </button>
          </div>

          <div id="layersList" class="space-y-2 max-h-48 overflow-y-auto custom-scroll">
            <p id="noLayersMsg" class="text-xs text-gray-400 italic text-center py-2">No active layers loaded yet.</p>
          </div>
        </div>

        <hr class="border-gray-200" />

        <!-- Global Settings -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="swapCoordsToggle" class="text-xs text-gray-700 font-medium">Swap Lat/Lng (If inverted)</label>
            <input type="checkbox" id="swapCoordsToggle" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
          </div>
        </div>

        <!-- Notification Box -->
        <div id="statusBox" class="hidden p-3 rounded-xl text-xs leading-tight"></div>
      </div>
    </aside>

    <!-- Map Canvas Area -->
    <main class="flex-1 h-full w-full relative">
      <div id="map"></div>
    </main>

  </div>

  <script>
    const STORAGE_KEY = 'leaflet_saved_geojson_layers_v2';

    // Global Active Layers Store
    // Item shape: { id, name, symbol, color, data, visible, leafletLayer }
    let layersStore = [];

    // Initialize Leaflet Map
    const map = L.map('map', {
      center: [24.8607, 67.0011], // Default coordinates
      zoom: 12,
      zoomControl: false
    });

    // Custom Zoom Control Top Right
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 1. Esri World Street Map
    const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // 2. OpenStreetMap Public Mirror
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    // 3. Esri World Imagery (Satellite)
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri'
    });

    // Add Basemap Layer Control Widget
    L.control.layers({
      "Esri Street Map": esriStreet,
      "OpenStreetMap": osm,
      "Esri Satellite": esriSat
    }, null, { position: 'topright' }).addTo(map);

    let userMarker = null;
    let userCircle = null;

    // Helper: Set Quick Preset Emoji
    function setEmoji(emoji) {
      document.getElementById('pointSymbolInput').value = emoji;
    }

    // Mobile Drawer Handlers
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');

    function openMobileDrawer() {
      sidebar.classList.remove('translate-y-full');
      backdrop.classList.remove('hidden');
    }

    function closeMobileDrawer() {
      if (window.innerWidth < 768) {
        sidebar.classList.add('translate-y-full');
        backdrop.classList.add('hidden');
      }
    }

    document.getElementById('openMobileMenuBtn').addEventListener('click', openMobileDrawer);
    document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileDrawer);
    backdrop.addEventListener('click', closeMobileDrawer);

    // Status Notification Helper
    function showStatus(message, isError = false) {
      const statusBox = document.getElementById('statusBox');
      statusBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      statusBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
      statusBox.textContent = message;
    }

    // Save All Layers to LocalStorage Persistence
    function saveLayersToStorage() {
      const exportable = layersStore.map(l => ({
        id: l.id,
        name: l.name,
        symbol: l.symbol,
        color: l.color,
        visible: l.visible,
        data: l.data
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(exportable));
    }

    // Create Leaflet Layer Instance from GeoJSON Data & Options
    function createLeafletLayer(geojsonData, symbol, color) {
      const swapCoords = document.getElementById('swapCoordsToggle').checked;

      return L.geoJSON(geojsonData, {
        // Styling for Polygons & Polylines (Lines stay visible)
        style: function(feature) {
          const isLine = feature.geometry && (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString');
          return {
            color: color || '#3B82F6',
            weight: isLine ? 4 : 3,
            opacity: 0.85,
            fillColor: color || '#60A5FA',
            fillOpacity: isLine ? 0 : 0.35
          };
        },
        // Coordinates LatLng Converter
        coordsToLatLng: function(coords) {
          return swapCoords 
            ? new L.LatLng(coords[0], coords[1]) 
            : new L.LatLng(coords[1], coords[0]);
        },
        // Point Feature Custom Symbolization (Emojis / Custom Icons)
        pointToLayer: function(feature, latlng) {
          const iconSymbol = symbol || '📍';
          const customIcon = L.divIcon({
            className: 'emoji-marker',
            html: `<div class="emoji-marker-inner">${iconSymbol}</div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 15],
            popupAnchor: [0, -12]
          });
          return L.marker(latlng, { icon: customIcon });
        },
        // Feature Popup Binding
        onEachFeature: function(feature, layer) {
          if (feature.properties) {
            let popupContent = '<div class="text-sm font-sans max-h-48 overflow-y-auto"><strong>Feature Attributes:</strong><br/>';
            for (const [key, value] of Object.entries(feature.properties)) {
              popupContent += `<span class="text-gray-600">${key}:</span> <b>${value}</b><br/>`;
            }
            popupContent += '</div>';
            layer.bindPopup(popupContent);
          }
        }
      });
    }

    // Add New GeoJSON Layer to Store & Map
    function addLayer(geojsonData, nameHint = 'Layer', customSymbol = '📍', customColor = '#3B82F6', autoSave = true) {
      try {
        const layerId = 'layer_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        const name = nameHint || `Layer ${layersStore.length + 1}`;
        const symbol = customSymbol || '📍';
        const color = customColor || '#3B82F6';

        const leafletLayer = createLeafletLayer(geojsonData, symbol, color).addTo(map);
        const bounds = leafletLayer.getBounds();

        const layerObj = {
          id: layerId,
          name: name,
          symbol: symbol,
          color: color,
          data: geojsonData,
          visible: true,
          leafletLayer: leafletLayer
        };

        layersStore.push(layerObj);

        if (bounds.isValid()) {
          map.flyToBounds(bounds, { padding: [40, 40], duration: 1.5 });
        }

        renderLayersListUI();
        if (autoSave) saveLayersToStorage();

        showStatus(`Layer "${name}" added successfully!`);
        closeMobileDrawer();

      } catch (err) {
        showStatus("Error rendering layer: " + err.message, true);
      }
    }

    // Render UI Sidebar Layer List
    function renderLayersListUI() {
      const listEl = document.getElementById('layersList');
      const countEl = document.getElementById('layerCount');
      countEl.textContent = layersStore.length;

      if (layersStore.length === 0) {
        listEl.innerHTML = '<p id="noLayersMsg" class="text-xs text-gray-400 italic text-center py-2">No active layers loaded yet.</p>';
        return;
      }

      listEl.innerHTML = '';
      layersStore.forEach(layer => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 rounded-lg bg-gray-50 border border-gray-200 text-xs gap-2';
        
        item.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden shrink-0">
            <input type="checkbox" ${layer.visible ? 'checked' : ''} onchange="toggleLayerVisibility('${layer.id}')" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
            <span class="text-base">${layer.symbol}</span>
            <span class="w-3 h-3 rounded-full shrink-0 border border-black/20" style="background-color: ${layer.color}"></span>
            <span class="font-medium text-gray-800 truncate max-w-[110px]" title="${layer.name}">${layer.name}</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="zoomToLayer('${layer.id}')" class="p-1 hover:bg-gray-200 rounded text-gray-600" title="Zoom to layer">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
            <button onclick="removeLayer('${layer.id}')" class="p-1 hover:bg-red-100 rounded text-red-600" title="Remove layer">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // Layer Controls
    function toggleLayerVisibility(layerId) {
      const layerObj = layersStore.find(l => l.id === layerId);
      if (!layerObj) return;

      layerObj.visible = !layerObj.visible;
      if (layerObj.visible) {
        layerObj.leafletLayer.addTo(map);
      } else {
        map.removeLayer(layerObj.leafletLayer);
      }
      saveLayersToStorage();
    }

    function zoomToLayer(layerId) {
      const layerObj = layersStore.find(l => l.id === layerId);
      if (!layerObj) return;
      const bounds = layerObj.leafletLayer.getBounds();
      if (bounds.isValid()) {
        map.flyToBounds(bounds, { padding: [40, 40], duration: 1.5 });
        closeMobileDrawer();
      }
    }

    function removeLayer(layerId) {
      const idx = layersStore.findIndex(l => l.id === layerId);
      if (idx !== -1) {
        map.removeLayer(layersStore[idx].leafletLayer);
        layersStore.splice(idx, 1);
        renderLayersListUI();
        saveLayersToStorage();
        showStatus("Layer removed.");
      }
    }

    document.getElementById('clearAllLayersBtn').addEventListener('click', function() {
      layersStore.forEach(l => map.removeLayer(l.leafletLayer));
      layersStore = [];
      renderLayersListUI();
      localStorage.removeItem(STORAGE_KEY);
      showStatus("All layers removed.");
    });

    // Re-render when coordinate swap checkbox toggles
    document.getElementById('swapCoordsToggle').addEventListener('change', function() {
      layersStore.forEach(l => {
        map.removeLayer(l.leafletLayer);
        l.leafletLayer = createLeafletLayer(l.data, l.symbol, l.color);
        if (l.visible) l.leafletLayer.addTo(map);
      });
    });

    // Inputs & Loaders Listeners
    function getLayerMetadata() {
      const name = document.getElementById('layerNameInput').value.trim();
      const symbol = document.getElementById('pointSymbolInput').value.trim() || '📍';
      const color = document.getElementById('layerColorInput').value;
      return { name, symbol, color };
    }

    // 1. File Upload
    document.getElementById('geojsonFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const meta = getLayerMetadata();
      const fileName = meta.name || file.name.replace(/\.[^/.]+$/, "");

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const json = JSON.parse(evt.target.result);
          addLayer(json, fileName, meta.symbol, meta.color);
        } catch (err) {
          showStatus("Failed to parse JSON file.", true);
        }
      };
      reader.readAsText(file);
    });

    // 2. Remote URL Loader
    document.getElementById('loadUrlBtn').addEventListener('click', function() {
      const url = document.getElementById('geojsonUrlInput').value.trim();
      if (!url) {
        showStatus("Please enter a valid URL.", true);
        return;
      }

      const meta = getLayerMetadata();
      const urlName = meta.name || 'URL Layer';

      showStatus("Fetching GeoJSON from link...");
      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error ${res.status}`);
          return res.json();
        })
        .then(data => {
          addLayer(data, urlName, meta.symbol, meta.color);
        })
        .catch(err => {
          showStatus("Failed to fetch URL: " + err.message, true);
        });
    });

    // 3. Raw Textarea Loader
    document.getElementById('loadTextBtn').addEventListener('click', function() {
      const text = document.getElementById('geojsonTextInput').value.trim();
      if (!text) {
        showStatus("Please paste GeoJSON content first.", true);
        return;
      }
      const meta = getLayerMetadata();
      try {
        const json = JSON.parse(text);
        addLayer(json, meta.name || 'Pasted Layer', meta.symbol, meta.color);
      } catch (err) {
        showStatus("Invalid GeoJSON string.", true);
      }
    });

    // Geolocation Core Handler
    function performGeolocation() {
      if (!navigator.geolocation) {
        showStatus("Geolocation is not supported by your browser.", true);
        return;
      }

      showStatus("Locating...");
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;

          if (userMarker) map.removeLayer(userMarker);
          if (userCircle) map.removeLayer(userCircle);

          userMarker = L.marker([latitude, longitude]).addTo(map)
            .bindPopup(`<b>Your Location</b><br/>Accuracy: ~${Math.round(accuracy)}m`)
            .openPopup();

          userCircle = L.circle([latitude, longitude], { radius: accuracy, color: '#6366F1', fillOpacity: 0.15 }).addTo(map);

          map.flyTo([latitude, longitude], 16, { duration: 1.5 });
          showStatus("Location found!");
          closeMobileDrawer();
        },
        (error) => {
          showStatus("Location access denied or timed out.", true);
        },
        { enableHighAccuracy: true }
      );
    }

    document.getElementById('locateBtn').addEventListener('click', performGeolocation);
    document.getElementById('quickLocateBtn').addEventListener('click', performGeolocation);

    // Auto-load Saved Layers from LocalStorage on Page Refresh
    window.addEventListener('DOMContentLoaded', () => {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        try {
          const layersArray = JSON.parse(savedData);
          layersArray.forEach(l => {
            const leafletLayer = createLeafletLayer(l.data, l.symbol, l.color);
            if (l.visible) leafletLayer.addTo(map);

            layersStore.push({
              id: l.id,
              name: l.name,
              symbol: l.symbol,
              color: l.color,
              data: l.data,
              visible: l.visible,
              leafletLayer: leafletLayer
            });
          });

          renderLayersListUI();
          showStatus("Restored saved layers from browser storage.");
        } catch (e) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }
    });
  </script>
</body>
</html>
