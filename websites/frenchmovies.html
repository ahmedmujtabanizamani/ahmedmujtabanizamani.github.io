<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Media Learning Roadmap</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .level-group {
      margin-bottom: 2.5rem;
    }

    .level-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .level-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .level-badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #8b949e;
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #21262d;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poster-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      color: var(--text-muted);
      gap: 0.5rem;
    }

    .poster-fallback svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      opacity: 0.5;
    }

    .card-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-type {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Simple Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .modal-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      padding: 1.5rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .modal-section {
      margin-top: 1rem;
    }

    .modal-section h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .modal-section p {
      font-size: 0.9rem;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>French Media Roadmap</h1>
      <p>Select a title to reveal listening notes and study strategies.</p>
    </header>

    <div id="roadmap"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modalType" class="card-type"></div>
      <h2 id="modalTitle" style="font-size: 1.25rem; margin-top: 0.25rem;"></h2>
      
      <div class="modal-section">
        <h4>Overview</h4>
        <p id="modalSynopsis"></p>
      </div>
      <div class="modal-section">
        <h4>Level Suitability</h4>
        <p id="modalReason"></p>
      </div>
      <div class="modal-section">
        <h4>Study Strategy</h4>
        <p id="modalTip"></p>
      </div>
    </div>
  </div>

  <script>
    const data = [
      {
        level: "Beginner",
        badge: "A2–B1",
        items: [
          {
            title: "Persepolis",
            type: "Animated Film",
            img: "https://image.tmdb.org/t/p/w500/A31I1OqfB1x3G2j1X7Yw7p9K9.jpg",
            synopsis: "A coming-of-age story set during the Iranian Revolution.",
            reason: "Clear studio audio with minimal background noise interference.",
            tip: "Use French subtitles to map spoken sounds directly to written text."
          },
          {
            title: "Les Choristes",
            type: "Drama Film",
            img: "https://image.tmdb.org/t/p/w500/q3U7S7A0K5V1Z2Y3X4W5V6U7.jpg",
            synopsis: "A music teacher transforms a strict boarding school through choral singing.",
            reason: "Features formal mid-century enunciation and structured dialogue.",
            tip: "Pay attention to formal addressing patterns (vouvoiement)."
          }
        ]
      },
      {
        level: "Intermediate",
        badge: "B1–B2",
        items: [
          {
            title: "Lupin",
            type: "TV Series • Netflix",
            img: "https://image.tmdb.org/t/p/w500/1S21al2I3P2S3X4W5V6U7T8.jpg",
            synopsis: "A gentleman thief uses charisma and clever disguises to avenge his father.",
            reason: "Action-driven scenes provide strong visual context for conversational dialogue.",
            tip: "Keep French subtitles active to track fast conversational transitions."
          },
          {
            title: "Dix Pour Cent",
            type: "TV Series • Netflix",
            img: "https://image.tmdb.org/t/p/w500/2S31al3I4P3S4X5W6V7U8T9.jpg",
            synopsis: "Parisian talent agents navigate celebrity demands and workplace drama.",
            reason: "Standard modern workplace vocabulary combined with contemporary Parisian pacing.",
            tip: "Note frequent conversational fillers like 'du coup' and 'en fait'."
          }
        ]
      },
      {
        level: "Upper-Intermediate",
        badge: "B2",
        items: [
          {
            title: "Amélie",
            type: "Romance / Comedy",
            img: "https://upload.wikimedia.org/wikipedia/en/5/53/Amelie_poster.jpg",
            synopsis: "An imaginative Parisian waitress orchestrates small acts of kindness.",
            reason: "Fast voiceover narration paired with expressive, non-standard vocabulary.",
            tip: "Focus on broad narrative context rather than translating individual words."
          },
          {
            title: "Family Business",
            type: "TV Series • Netflix",
            img: "https://image.tmdb.org/t/p/w500/3S41al4I5P4S5X6W7V8U9T0.jpg",
            synopsis: "A Parisian family converts their struggling butcher shop into a coffee shop.",
            reason: "Fast, informal family bickering rich in modern French slang (*verlan*).",
            tip: "Try short 5-minute listening blocks with subtitles disabled."
          }
        ]
      },
      {
        level: "Advanced",
        badge: "C1+",
        items: [
          {
            title: "La Haine",
            type: "Crime / Drama",
            img: "https://upload.wikimedia.org/wikipedia/en/2/26/La_haine_poster.jpg",
            synopsis: "24 hours in the lives of three young men living in the Parisian suburbs.",
            reason: "Heavy reliance on authentic 1990s street dialogue and reversed slang.",
            tip: "Serves as an ideal benchmark for unedited, authentic native speech."
          },
          {
            title: "Chez les Ch'tis",
            type: "Comedy Film",
            img: "https://upload.wikimedia.org/wikipedia/en/7/7d/Bienvenue_chez_les_Ch%27tis_Poster.jpg",
            synopsis: "A southern postal worker is relocated to a small northern town.",
            reason: "Built entirely around regional dialects, accents, and phonetic humor.",
            tip: "Identify how regional vowel shifts differ from standard Parisian pronunciation."
          }
        ]
      }
    ];

    function handleImageError(img, title) {
      const container = img.parentElement;
      container.innerHTML = `
        <div class="poster-fallback">
          <svg viewBox="0 0 24 24"><path d="M18 3H6c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-6 2c1.38 0 2.5 1.12 2.5 2.5S13.38 10 12 10s-2.5-1.12-2.5-2.5S10.62 5 12 5zm6 14H6v-.5c0-2 4-3.1 6-3.1s6 1.1 6 3.1v.5z"/></svg>
          <span style="font-size: 0.8rem; font-weight: 600;">${title}</span>
        </div>
      `;
    }

    const roadmapContainer = document.getElementById('roadmap');

    data.forEach(sec => {
      const group = document.createElement('div');
      group.className = 'level-group';

      group.innerHTML = `
        <div class="level-header">
          <span class="level-title">${sec.level}</span>
          <span class="level-badge">${sec.badge}</span>
        </div>
        <div class="grid" id="grid-${sec.level.replace(/\s+/g, '')}"></div>
      `;

      roadmapContainer.appendChild(group);

      const grid = group.querySelector('.grid');

      sec.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        const imgEl = document.createElement('img');
        imgEl.src = item.img;
        imgEl.alt = item.title;
        imgEl.onerror = () => handleImageError(imgEl, item.title);

        card.innerHTML = `
          <div class="poster-box"></div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-type">${item.type}</div>
          </div>
        `;

        card.querySelector('.poster-box').appendChild(imgEl);
        grid.appendChild(card);
      });
    });

    const modal = document.getElementById('modal');

    function openModal(item) {
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalType').textContent = item.type;
      document.getElementById('modalSynopsis').textContent = item.synopsis;
      document.getElementById('modalReason').textContent = item.reason;
      document.getElementById('modalTip').textContent = item.tip;
      modal.classList.add('open');
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
