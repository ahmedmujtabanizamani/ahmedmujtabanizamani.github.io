<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Media Roadmap</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --muted: #94a3b8;
      
      --l1: #10b981;
      --l2: #3b82f6;
      --l3: #f59e0b;
      --l4: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 1rem 0.75rem;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: var(--muted); font-size: 0.95rem; margin-top: 0.25rem; }

    .section-title {
      font-size: clamp(1.1rem, 3vw, 1.3rem);
      margin: 2rem 0 1rem;
    }

    /* Mobile First Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.85rem;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 1.25rem; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .poster-box {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 0.75rem;
    }

    .poster-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    /* Fallback layout when image is broken */
    .poster-box img.broken {
      display: none;
    }

    .fallback-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      z-index: 1;
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      z-index: 2;
    }

    .badge-l1 { background: var(--l1); }
    .badge-l2 { background: var(--l2); }
    .badge-l3 { background: var(--l3); }
    .badge-l4 { background: var(--l4); }

    .card-info { padding: 0.75rem; }
    .media-type { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin: 0.2rem 0; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal-section { margin-top: 1rem; }
    .modal-section h4 { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem; }
    .modal-section p { font-size: 0.9rem; color: var(--text); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>French Media Learning Roadmap</h1>
      <p>Tap any title to view details and listening tips</p>
    </header>

    <div id="app"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <span class="media-type" id="mType"></span>
      <h2 id="mTitle" style="margin-top: 0.2rem;"></h2>
      
      <div class="modal-section">
        <h4>Synopsis</h4>
        <p id="mSynopsis"></p>
      </div>
      <div class="modal-section">
        <h4>Listening Fit</h4>
        <p id="mReason"></p>
      </div>
      <div class="modal-section">
        <h4>Pro Tip</h4>
        <p id="mTip"></p>
      </div>
    </div>
  </div>

  <script>
    const data = [
      {
        level: "Level 1: Beginner (A2–B1)",
        badgeClass: "badge-l1",
        badgeText: "A2–B1",
        items: [
          {
            title: "Persepolis",
            type: "Film (Animation)",
            img: "https://m.media-amazon.com/images/M/MV5BMjA4MTI5NzAyNV5BMl5BanBnXkFtZTcwMjI4NzcyMw@@._V1_.jpg",
            synopsis: "A coming-of-age story of a young girl growing up during the Iranian Revolution.",
            reason: "Studio voiceover removes background noise and articulates words deliberately.",
            tip: "Use French subtitles to easily link written spelling with spoken sounds."
          },
          {
            title: "Les Choristes",
            type: "Film (Drama)",
            img: "https://m.media-amazon.com/images/M/MV5BN2E1Mjc5YmItNDkyNC00NTFiLWIxOWEtYmJjNTViM2U0YmI1XkEyXkFqcGdeQXVyMjA3NzE4NjE@._V1_.jpg",
            synopsis: "A music teacher transforms a strict boarding school through choral music.",
            reason: "Teachers use formal, clear, and steady mid-century dialogue.",
            tip: "Great for listening to formal addresses (vouvoiement)."
          }
        ]
      },
      {
        level: "Level 2: Intermediate (B1–B2)",
        badgeClass: "badge-l2",
        badgeText: "B1–B2",
        items: [
          {
            title: "Lupin",
            type: "Show • Netflix",
            img: "https://m.media-amazon.com/images/M/MV5BZjA0MTM4MTQtNzYyYS00NDM1LWIxMGItN2JjMTAzMjc4YjBmXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg",
            synopsis: "Assane Diop sets out to avenge his father using skills inspired by gentleman thief Arsène Lupin.",
            reason: "Visual action carries the narrative, making spoken dialogue easier to parse.",
            tip: "Watch with French subtitles to catch natural speech drops."
          }
        ]
      },
      {
        level: "Level 3: Upper-Intermediate (B2)",
        badgeClass: "badge-l3",
        badgeText: "B2",
        items: [
          {
            title: "Amélie",
            type: "Film (Romance)",
            img: "https://m.media-amazon.com/images/M/MV5BNDg4NjM1YjMtYmNhZC00MjM0LWFiZmItNzk1YmJiNmJhZmE2XkEyXkFqcGdeQXVyNTA4NzY1MzY@._V1_.jpg",
            synopsis: "An imaginative Parisian waitress decides to secretly change the lives of people around her.",
            reason: "Features fast-paced voiceover narration and rich French wordplay.",
            tip: "Don't pause on unknown words; let the visual storytelling guide you."
          }
        ]
      }
    ];

    const app = document.getElementById('app');

    data.forEach(sec => {
      const h2 = document.createElement('h2');
      h2.className = 'section-title';
      h2.textContent = sec.level;
      app.appendChild(h2);

      const grid = document.createElement('div');
      grid.className = 'grid';

      sec.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <div class="poster-box">
            <span class="badge ${sec.badgeClass}">${sec.badgeText}</span>
            <img src="${item.img}" alt="${item.title}" onerror="this.classList.add('broken')">
            <span class="fallback-title">${item.title}</span>
          </div>
          <div class="card-info">
            <span class="media-type">${item.type}</span>
            <div class="card-title">${item.title}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      app.appendChild(grid);
    });

    const overlay = document.getElementById('modalOverlay');

    function openModal(item) {
      document.getElementById('mTitle').textContent = item.title;
      document.getElementById('mType').textContent = item.type;
      document.getElementById('mSynopsis').textContent = item.synopsis;
      document.getElementById('mReason').textContent = item.reason;
      document.getElementById('mTip').textContent = item.tip;
      overlay.classList.add('active');
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });
  </script>
</body>
</html>
