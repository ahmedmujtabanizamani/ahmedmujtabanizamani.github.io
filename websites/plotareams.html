<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One Multi-Side Plot Area Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.8rem;
      color: #1e293b;
    }
    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 850px) {
      .layout-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #334155;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }
    .control-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 130px;
    }
    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
    }
    input, select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #2563eb; }
    
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
      margin: 12px 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .input-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-card label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-success { background: #16a34a; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #ffffff; }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }
    
    #errorMsg {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
    #resultSummary {
      margin-top: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #0369a1;
      background: #e0f2fe;
      padding: 10px 14px;
      border-radius: 6px;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .rotation-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 260px;
    }
    .rotation-control label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .rotation-control input[type="range"] {
      flex: 1;
      cursor: pointer;
      padding: 0;
    }

    canvas {
      width: 100%;
      height: 380px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 8px;
      display: block;
    }
    .history-card {
      max-width: 1200px;
      margin: 20px auto 0 auto;
    }
    .saved-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .saved-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>All-in-One Multi-Side Plot Calculator</h1>
  </div>

  <div class="layout-grid">
    <!-- Configuration Panel -->
    <div class="card">
      <h2>1. Entire Plot Dimensions</h2>
      
      <div class="control-row">
        <div class="input-group">
          <label for="numSides">Number of Sides</label>
          <select id="numSides" onchange="updateOriginDropdown()">
            <option value="4" selected>4-Sided Plot (Quadrilateral)</option>
            <option value="5">5-Sided Plot (Pentagon)</option>
            <option value="6">6-Sided Plot (Hexagon)</option>
          </select>
        </div>
        <div class="input-group">
          <label for="originVertex">Diagonal Origin Vertex</label>
          <select id="originVertex" onchange="buildInputs()">
            <!-- Populated dynamically -->
          </select>
        </div>
        <div class="input-group">
          <label for="unitSelect">Unit</label>
          <select id="unitSelect" onchange="calculateAndDraw()">
            <option value="ft">Feet (ft)</option>
            <option value="m">Meters (m)</option>
            <option value="yd">Yards (yd)</option>
          </select>
        </div>
      </div>

      <div class="section-title">Outer Perimeter Sides</div>
      <div class="inputs-grid" id="sidesContainer"></div>

      <div class="section-title" id="diagTitle">Internal Diagonals</div>
      <div class="inputs-grid" id="diagonalsContainer"></div>

      <div id="errorMsg"></div>
      <div id="resultSummary">Total Plot Area: 0.00 sq ft</div>

      <div class="btn-group">
        <button class="btn-primary" onclick="calculateAndDraw()">Calculate & Draw Plot</button>
        <button class="btn-success" onclick="savePlot()">Save Plot</button>
      </div>
    </div>

    <!-- Canvas Preview Panel -->
    <div class="card">
      <h2>2. Reconstructed Plot Map</h2>
      
      <div class="canvas-header">
        <div class="rotation-control">
          <label for="rotationAngle">Rotate: <span id="rotVal">0</span>°</label>
          <input type="range" id="rotationAngle" min="0" max="360" value="0" oninput="onRotateInput(this.value)">
        </div>
        <button class="btn-sm btn-primary" onclick="resetRotation()">Reset Rotation</button>
      </div>

      <canvas id="plotCanvas" width="500" height="380"></canvas>
      <p style="font-size:0.8rem; color:#64748b; margin-top:8px;">
        * Edge/diagonal lengths are labeled directly on the canvas. Adjust the slider to match real-world alignment.
      </p>
    </div>
  </div>

  <!-- Saved Items Panel -->
  <div class="card history-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2>Saved Plots</h2>
      <button class="btn-danger btn-sm" onclick="clearHistory()">Clear History</button>
    </div>
    <ul id="savedList" class="saved-list"></ul>
  </div>

  <script>
    let currentPlotData = null;
    let rotationAngle = 0;

    window.onload = function() {
      updateOriginDropdown();
      renderHistory();
    };

    function onRotateInput(val) {
      rotationAngle = parseInt(val) || 0;
      document.getElementById('rotVal').innerText = rotationAngle;
      if (currentPlotData) {
        currentPlotData.rotation = rotationAngle;
        drawPlot(currentPlotData.rawVertices, currentPlotData.unit, currentPlotData.totalAreaVal, currentPlotData.origin);
      }
    }

    function resetRotation() {
      document.getElementById('rotationAngle').value = 0;
      onRotateInput(0);
    }

    function updateOriginDropdown() {
      const n = parseInt(document.getElementById('numSides').value);
      const originSelect = document.getElementById('originVertex');
      const currentVal = parseInt(originSelect.value) || 1;
      
      originSelect.innerHTML = '';
      for (let i = 1; i <= n; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Vertex V${i}`;
        if (i === (currentVal > n ? 1 : currentVal)) opt.selected = true;
        originSelect.appendChild(opt);
      }
      buildInputs();
    }

    function buildInputs() {
      const n = parseInt(document.getElementById('numSides').value);
      const origin = parseInt(document.getElementById('originVertex').value) || 1;
      const sidesContainer = document.getElementById('sidesContainer');
      const diagContainer = document.getElementById('diagonalsContainer');
      
      sidesContainer.innerHTML = '';
      diagContainer.innerHTML = '';

      document.getElementById('diagTitle').innerText = `Internal Diagonals (From V${origin})`;

      const defaults = {
        4: { sides: [40, 50, 45, 55], diags: [65] },
        5: { sides: [40, 50, 45, 35, 50], diags: [65, 60] },
        6: { sides: [40, 50, 45, 35, 40, 50], diags: [65, 60, 70] }
      }[n];

      for (let i = 0; i < n; i++) {
        const vStart = i + 1;
        const vEnd = (i + 1) % n + 1;
        const div = document.createElement('div');
        div.className = 'input-card';
        div.innerHTML = `
          <label>Side S${i + 1} (V${vStart}-V${vEnd})</label>
          <input type="number" class="side-input" value="${defaults.sides[i]}" step="any" min="0.1">
        `;
        sidesContainer.appendChild(div);
      }

      for (let i = 0; i < n - 3; i++) {
        const targetV = ((origin - 1 + i + 2) % n) + 1;
        const div = document.createElement('div');
        div.className = 'input-card';
        div.innerHTML = `
          <label>Diagonal D${i + 1} (V${origin}-V${targetV})</label>
          <input type="number" class="diag-input" value="${defaults.diags[i]}" step="any" min="0.1">
        `;
        diagContainer.appendChild(div);
      }

      calculateAndDraw();
    }

    function calculateHeron(a, b, c) {
      if (a + b <= c || a + c <= b || b + c <= a) return null;
      const s = (a + b + c) / 2;
      return Math.sqrt(s * (s - a) * (s - b) * (s - c));
    }

    function getUnitLabel(unit) {
      if (unit === 'm') return 'sq m';
      if (unit === 'yd') return 'sq yd';
      return 'sq ft';
    }

    function calculateAndDraw() {
      const errBox = document.getElementById('errorMsg');
      errBox.style.display = 'none';
      errBox.innerText = '';

      const n = parseInt(document.getElementById('numSides').value);
      const origin = parseInt(document.getElementById('originVertex').value) || 1;
      const unit = document.getElementById('unitSelect').value;
      const areaUnit = getUnitLabel(unit);

      const sideInputs = document.querySelectorAll('.side-input');
      const diagInputs = document.querySelectorAll('.diag-input');

      let rawSides = [];
      let diags = [];

      for (let input of sideInputs) {
        let v = parseFloat(input.value);
        if (isNaN(v) || v <= 0) return showError('All side lengths must be positive numbers.');
        rawSides.push(v);
      }

      for (let input of diagInputs) {
        let v = parseFloat(input.value);
        if (isNaN(v) || v <= 0) return showError('All diagonal lengths must be positive numbers.');
        diags.push(v);
      }

      let shiftedSides = [];
      for (let i = 0; i < n; i++) {
        shiftedSides.push(rawSides[(origin - 1 + i) % n]);
      }

      let totalArea = 0;
      let triangles = [];

      for (let i = 0; i < n - 2; i++) {
        let sideA = (i === 0) ? shiftedSides[0] : diags[i - 1];
        let sideB = shiftedSides[i + 1];
        let sideC = (i === n - 3) ? shiftedSides[n - 1] : diags[i];

        let area = calculateHeron(sideA, sideB, sideC);
        if (area === null) {
          return showError(`Triangle T${i + 1} with sides (${sideA.toFixed(1)}, ${sideB.toFixed(1)}, ${sideC.toFixed(1)}) is geometrically impossible.`);
        }
        totalArea += area;
        triangles.push({ a: sideA, b: sideB, c: sideC, area: area });
      }

      document.getElementById('resultSummary').innerText = `Total Plot Area: ${totalArea.toFixed(2)} ${areaUnit}`;

      let shiftedVertices = [{ x: 0, y: 0 }, { x: shiftedSides[0], y: 0 }];
      let currentAngle = 0;

      for (let i = 0; i < n - 2; i++) {
        let a = triangles[i].a;
        let b = triangles[i].b;
        let c = triangles[i].c;

        let cosA = (a * a + c * c - b * b) / (2 * a * c);
        cosA = Math.max(-1, Math.min(1, cosA));
        let alpha = Math.acos(cosA);

        currentAngle += alpha;

        let nextX = c * Math.cos(currentAngle);
        let nextY = c * Math.sin(currentAngle);
        shiftedVertices.push({ x: nextX, y: nextY });
      }

      let rawVertices = new Array(n);
      for (let i = 0; i < n; i++) {
        let origIdx = (origin - 1 + i) % n;
        rawVertices[origIdx] = shiftedVertices[i];
      }

      currentPlotData = {
        n: n,
        origin: origin,
        sides: rawSides,
        diags: diags,
        unit: unit,
        totalAreaVal: totalArea,
        totalArea: totalArea.toFixed(2),
        rawVertices: rawVertices,
        rotation: rotationAngle,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      drawPlot(rawVertices, unit, totalArea, origin);
    }

    function showError(msg) {
      const errBox = document.getElementById('errorMsg');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }

    function rotatePoint(p, cx, cy, angleDeg) {
      const rad = (angleDeg * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const dx = p.x - cx;
      const dy = p.y - cy;
      return {
        x: cx + dx * cos - dy * sin,
        y: cy + dx * sin + dy * cos
      };
    }

    function drawPlot(rawVertices, unit, totalArea, origin) {
      const canvas = document.getElementById('plotCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const n = rawVertices.length;
      const areaUnit = getUnitLabel(unit);

      // 1. Rotate vertices around centroid
      const cx = rawVertices.reduce((sum, v) => sum + v.x, 0) / n;
      const cy = rawVertices.reduce((sum, v) => sum + v.y, 0) / n;
      const rotatedVertices = rawVertices.map(v => rotatePoint(v, cx, cy, rotationAngle));

      // 2. Calculate scale and bounding box
      let minX = Math.min(...rotatedVertices.map(v => v.x));
      let maxX = Math.max(...rotatedVertices.map(v => v.x));
      let minY = Math.min(...rotatedVertices.map(v => v.y));
      let maxY = Math.max(...rotatedVertices.map(v => v.y));

      let plotWidth = maxX - minX || 1;
      let plotHeight = maxY - minY || 1;
      let padding = 60; // Extra room for side labels

      let scaleX = (canvas.width - padding * 2) / plotWidth;
      let scaleY = (canvas.height - padding * 2) / plotHeight;
      let scale = Math.min(scaleX, scaleY);

      function mapPoint(p) {
        return {
          x: padding + (p.x - minX) * scale,
          y: canvas.height - padding - (p.y - minY) * scale
        };
      }

      let mapped = rotatedVertices.map(mapPoint);
      let originIdx = origin - 1;

      // 3. Draw Inner Diagonals (Dashed lines)
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;

      for (let i = 0; i < n - 3; i++) {
        let targetIdx = (originIdx + i + 2) % n;
        ctx.beginPath();
        ctx.moveTo(mapped[originIdx].x, mapped[originIdx].y);
        ctx.lineTo(mapped[targetIdx].x, mapped[targetIdx].y);
        ctx.stroke();

        // Label Diagonals
        let mx = (mapped[originIdx].x + mapped[targetIdx].x) / 2;
        let my = (mapped[originIdx].y + mapped[targetIdx].y) / 2;
        drawTextBadge(ctx, `D${i + 1}: ${currentPlotData.diags[i]} ${unit}`, mx, my, '#f1f5f9', '#64748b', true);
      }
      ctx.setLineDash([]);

      // 4. Fill Outer Polygon Shape
      ctx.beginPath();
      ctx.moveTo(mapped[0].x, mapped[0].y);
      for (let i = 1; i < mapped.length; i++) {
        ctx.lineTo(mapped[i].x, mapped[i].y);
      }
      ctx.closePath();

      ctx.fillStyle = 'rgba(147, 197, 253, 0.4)';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1e3a8a';
      ctx.stroke();

      // 5. Outer Side Length Badges
      for (let i = 0; i < n; i++) {
        let p1 = mapped[i];
        let p2 = mapped[(i + 1) % n];
        let mx = (p1.x + p2.x) / 2;
        let my = (p1.y + p2.y) / 2;
        let sideLength = currentPlotData.sides[i];

        drawTextBadge(ctx, `S${i + 1}: ${sideLength} ${unit}`, mx, my, '#ffffff', '#1e293b', false);
      }

      // 6. Vertices & Labels
      mapped.forEach((pt, idx) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = (idx === originIdx) ? '#dc2626' : '#0f172a';
        ctx.fill();

        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = (idx === originIdx) ? '#dc2626' : '#0f172a';
        ctx.fillText(`V${idx + 1}`, pt.x + 10, pt.y - 10);
      });

      // 7. Center Area Tag
      let centerMappedX = mapped.reduce((a, b) => a + b.x, 0) / mapped.length;
      let centerMappedY = mapped.reduce((a, b) => a + b.y, 0) / mapped.length;

      drawTextBadge(ctx, `${totalArea.toFixed(2)} ${areaUnit}`, centerMappedX, centerMappedY, '#0284c7', '#ffffff', false, true);
    }

    // Badge Drawing Helper for readability on canvas
    function drawTextBadge(ctx, text, x, y, bgColor, textColor, isItalic = false, isBold = false) {
      ctx.save();
      ctx.font = `${isBold ? 'bold ' : ''}${isItalic ? 'italic ' : ''}11px sans-serif`;
      const textMetrics = ctx.measureText(text);
      const padX = 6;
      const padY = 3;
      const w = textMetrics.width + padX * 2;
      const h = 16 + padY;

      ctx.fillStyle = bgColor;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1;

      // Draw rounded rectangle badge
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y - h / 2, w, h, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // LocalStorage Functions
    function savePlot() {
      if (!currentPlotData) return;
      let saved = JSON.parse(localStorage.getItem('all_in_one_plots')) || [];
      saved.push(currentPlotData);
      localStorage.setItem('all_in_one_plots', JSON.stringify(saved));
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('savedList');
      list.innerHTML = '';
      let saved = JSON.parse(localStorage.getItem('all_in_one_plots')) || [];

      if (saved.length === 0) {
        list.innerHTML = '<li style="color:#64748b;">No saved plots.</li>';
        return;
      }

      saved.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'saved-item';
        li.innerHTML = `
          <div>
            <strong>Plot #${index + 1} (${item.n}-Sided)</strong>
            <div>${item.totalArea} ${getUnitLabel(item.unit)}</div>
            <small style="color:#64748b;">Saved at ${item.date} (Origin: V${item.origin || 1})</small>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-primary btn-sm" onclick="loadPlot(${index})">Load</button>
            <button class="btn-danger btn-sm" onclick="deletePlot(${index})">Delete</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function loadPlot(index) {
      let saved = JSON.parse(localStorage.getItem('all_in_one_plots')) || [];
      const item = saved[index];
      if (!item) return;

      document.getElementById('numSides').value = item.n;
      updateOriginDropdown();
      document.getElementById('originVertex').value = item.origin || 1;
      document.getElementById('unitSelect').value = item.unit;
      buildInputs();

      const sideInputs = document.querySelectorAll('.side-input');
      const diagInputs = document.querySelectorAll('.diag-input');

      item.sides.forEach((val, i) => { if (sideInputs[i]) sideInputs[i].value = val; });
      item.diags.forEach((val, i) => { if (diagInputs[i]) diagInputs[i].value = val; });

      if (item.rotation !== undefined) {
        document.getElementById('rotationAngle').value = item.rotation;
        onRotateInput(item.rotation);
      }

      calculateAndDraw();
    }

    function deletePlot(index) {
      let saved = JSON.parse(localStorage.getItem('all_in_one_plots')) || [];
      saved.splice(index, 1);
      localStorage.setItem('all_in_one_plots', JSON.stringify(saved));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem('all_in_one_plots');
      renderHistory();
    }
  </script>
</body>
</html>
